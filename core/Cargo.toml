[package]
name = "minband-core"
version = "0.2.0"
edition = "2021"
description = "Contact extraction, trickle-link scheduler and self-contained wire codec shared by the edge and the receiver"
license = "MIT"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
