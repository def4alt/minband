<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MinBand 3D</title>
<style>
  :root { --bg: #070809; --ink: #e9ecef; --ink-2: #9aa3ad; --ink-3: #4a525b; --ink-4: #1a1e23; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 300 13px/1.4 Inter, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  .lbl { text-transform: uppercase; letter-spacing: .18em; font-size: 10px; color: var(--ink-2); }
  .val { font: 400 13px/1.3 "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; color: var(--ink); }
  #top { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 28px; align-items: flex-end; padding: 10px 16px 9px; border-bottom: 1px solid var(--ink-3); background: rgba(7,8,9,.86); z-index: 3; flex-wrap: wrap; }
  #top h1 { margin: 0 8px 0 0; font-weight: 200; font-size: 22px; letter-spacing: .3em; }
  .pair { display: flex; flex-direction: column; gap: 2px; min-width: 70px; }
  button { background: none; border: 0; border-bottom: 1px solid var(--ink-3); color: var(--ink-2); font: inherit; text-transform: uppercase; letter-spacing: .14em; font-size: 10px; padding: 3px 4px; cursor: pointer; }
  button:hover { color: var(--ink); border-color: var(--ink-2); }
  button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .group { display: flex; gap: 4px; align-items: center; }
  #scene { position: absolute; inset: 0; }
  #videoBox { position: absolute; left: 16px; bottom: 16px; width: min(34vw, 560px); aspect-ratio: 16 / 9; border: 1px solid var(--ink-3); background: #000; z-index: 2; }
  #videoBox video, #videoBox canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #videoBox .cap { position: absolute; left: 6px; top: 4px; z-index: 2; }
  #videoBox.down video { filter: grayscale(1) brightness(.18); }
  #videoBox.down canvas { opacity: 0; }
  #videoDown { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; z-index: 2; padding: 12px; }
  #videoBox.down #videoDown { display: flex; }
  #side { position: absolute; right: 16px; bottom: 16px; width: 330px; max-height: 42vh; overflow: hidden; border-left: 1px solid var(--ink-3); padding: 6px 8px 6px 12px; z-index: 2; background: rgba(7,8,9,.82); }
  #events div { font: 400 11px/1.45 "IBM Plex Mono", ui-monospace, monospace; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #events span { color: var(--ink-3); margin-right: 6px; }
  #note { margin-top: 10px; font-size: 11px; color: var(--ink-2); line-height: 1.45; }
  .tag { font: 400 10px/1 "IBM Plex Mono", ui-monospace, monospace; color: var(--ink); background: rgba(7,8,9,.7); padding: 2px 4px; white-space: nowrap; pointer-events: none; }
  .tag.dim { color: var(--ink-2); }
</style>
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
</head>
<body>
<div id="scene"></div>
<div id="top">
  <h1>MINBAND</h1>
  <div class="pair"><span class="lbl">Scene</span><span class="group" id="scenes"></span></div>
  <div class="pair"><span class="lbl">Map</span><span class="val" id="vMap">-</span></div>
  <div class="pair"><span class="lbl">Link</span><span class="group" id="profiles"></span></div>
  <div class="pair"><span class="lbl">Wire</span><span class="val" id="vWire">-</span></div>
  <div class="pair"><span class="lbl">Twin</span><span class="val" id="vTwin">-</span></div>
  <div class="pair"><span class="lbl">Chips</span><span class="val" id="vChips">-</span></div>
  <div class="pair"><span class="lbl">Time</span><span class="val" id="vTime">-</span></div>
  <div class="pair"><span class="lbl">View</span><span class="group" id="views"></span></div>
  <div class="pair"><span class="lbl">Show</span><span class="group"><button id="bTruth">Edge truth</button><button id="bRings" class="on">Rings</button></span></div>
  <div class="pair"><span class="lbl">Replay</span><span class="group"><button id="bPlay">Pause</button><button id="bStart">Restart</button></span></div>
</div>
<div id="videoBox">
  <video id="video" muted playsinline preload="auto"></video>
  <canvas id="overlay"></canvas>
  <div class="cap lbl">Drone video &middot; edge detections</div>
  <div id="videoDown"><div><div class="lbl" style="color:var(--ink)">Video link down</div><div class="lbl" style="margin-top:6px">the scene is drawn from contact reports</div></div></div>
</div>
<div id="side">
  <div class="lbl">Derived events</div>
  <div id="events"></div>
  <div id="note"></div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
