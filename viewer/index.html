<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MinBand twin</title>
  <style>
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --panel: #161b22cc; --accent: #58a6ff; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    #app { display: grid; grid-template-columns: 1fr 320px; grid-template-rows: 1fr 140px; height: 100vh; }
    #scene { grid-row: 1 / 3; position: relative; }
    #scene canvas { display: block; }
    #side { background: var(--panel); padding: 12px; overflow: auto; border-left: 1px solid #30363d; }
    #log { grid-column: 2; background: var(--panel); border-top: 1px solid #30363d; padding: 8px 12px; overflow: auto; color: var(--muted); font-size: 11px; white-space: pre; }
    h1 { font-size: 14px; margin: 0 0 8px; color: var(--accent); }
    label { display: block; margin: 8px 0 2px; color: var(--muted); }
    input[type=range] { width: 100%; }
    .row { display: flex; justify-content: space-between; gap: 8px; }
    .big { font-size: 22px; font-weight: 600; }
    #graph { width: 100%; height: 70px; background: #0b0f14; border: 1px solid #30363d; }
    .baseline { color: var(--muted); font-size: 11px; }
    #hud { position: absolute; left: 12px; top: 12px; background: var(--panel); padding: 8px 10px; border-radius: 6px; }
    button { background: #21262d; color: var(--fg); border: 1px solid #30363d; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
    button.on { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <div id="app">
    <div id="scene"><div id="hud">connecting…</div></div>
    <aside id="side">
      <h1>MinBand twin</h1>
      <div class="row"><span>link in</span><span class="big" id="bps">0 bps</span></div>
      <canvas id="graph"></canvas>
      <div class="baseline" id="baselines"></div>
      <label>bandwidth cap <span id="bpsv">off</span></label>
      <input id="capSlider" type="range" min="0" max="20" value="0" />
      <label>latency <span id="delayv">0 ms</span></label>
      <input id="delaySlider" type="range" min="0" max="2000" step="50" value="0" />
      <label>packet loss <span id="lossv">0%</span></label>
      <input id="lossSlider" type="range" min="0" max="90" value="0" />
      <label>edge byte budget <span id="budgetv">unlimited</span></label>
      <input id="budgetSlider" type="range" min="0" max="20" value="0" />
      <div class="row" style="margin-top:10px">
        <button id="impair">impairment: off</button>
        <button id="fusion" class="on">fusion: on</button>
        <button id="ghosts">ghosts</button>
      </div>
      <div id="devices" style="margin-top:12px"></div>
    </aside>
    <pre id="log"></pre>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
