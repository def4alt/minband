<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MinBand twin</title>
  <style>
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --panel: #161b22cc; --panel-solid: #161b22; --line: #30363d; --accent: #58a6ff; --warn: #ff7b72; --ok: #3fb950; --sheet-peek: 64px; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    #app { display: grid; grid-template-columns: 1fr 320px; grid-template-rows: 1fr 140px; height: 100vh; height: 100dvh; }
    #stage { grid-row: 1 / 3; display: flex; min-width: 0; min-height: 0; }
    #scene { flex: 1 1 0; position: relative; min-width: 0; min-height: 0; overflow: hidden; }
    #scene canvas { display: block; }
    #side { background: var(--panel); padding: 12px; overflow: auto; border-left: 1px solid var(--line); }
    #log { grid-column: 2; margin: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 8px 12px; overflow: auto; color: var(--muted); font-size: 11px; white-space: pre; }
    h1 { font-size: 14px; margin: 0 0 8px; color: var(--accent); }
    label { display: block; margin: 8px 0 2px; color: var(--muted); }
    input[type=range] { width: 100%; }
    select { width: 100%; background: #21262d; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; }
    .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .big { font-size: 22px; font-weight: 600; }
    #graph { width: 100%; height: 70px; background: #0b0f14; border: 1px solid var(--line); }
    .baseline { color: var(--muted); font-size: 11px; }
    .readout { margin-top: 10px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #0b0f14; }
    .readout .big { font-size: 18px; }
    #hud { position: absolute; left: 12px; top: 12px; right: 12px; width: fit-content; max-width: calc(100% - 24px); background: var(--panel); padding: 8px 10px; border-radius: 6px; pointer-events: none; }
    #hud .alert { color: var(--warn); font-weight: 600; }
    button { background: #21262d; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
    button.on { border-color: var(--accent); color: var(--accent); }
    .dev { margin-top: 6px; }
    .tag { font-size: 10px; padding: 0 4px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
    .tag.warn { color: var(--warn); border-color: var(--warn); }

    /* Side-by-side: twin left, raw-camera stand-in right. */
    #camera { flex: 1 1 0; position: relative; min-width: 0; min-height: 0; background: #000; border-left: 1px solid var(--line); overflow: hidden; }
    #camera[hidden] { display: none; }
    #cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #camPlaceholder { position: absolute; inset: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 2px dashed var(--line); border-radius: 8px; color: var(--muted); text-align: center; padding: 12px; }
    #camPlaceholder[hidden] { display: none; }
    #camOverlay { position: absolute; left: 12px; right: 12px; bottom: 12px; background: #000a; padding: 8px 10px; border-radius: 6px; }
    #camOverlay .big { color: var(--warn); font-size: 18px; }
    #camBar { position: absolute; right: 12px; top: 12px; width: 140px; }
    #camTitle { position: absolute; left: 12px; top: 12px; max-width: calc(100% - 190px); box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: #000a; padding: 4px 8px; border-radius: 6px; color: var(--muted); }
    .sheet-handle { display: none; }

    /* Narrow screens: stage on top, side panel becomes a bottom sheet. */
    @media (max-width: 900px) {
      #app { display: block; position: relative; height: 100dvh; overflow: hidden; }
      #stage { position: absolute; left: 0; right: 0; top: 0; bottom: var(--sheet-peek); flex-direction: column; }
      #camera { border-left: 0; border-top: 1px solid var(--line); }
      #side { position: fixed; left: 0; right: 0; bottom: 0; max-height: 75dvh; box-sizing: border-box; padding: 0 16px calc(12px + env(safe-area-inset-bottom)); background: var(--panel-solid); border-left: 0; border-top: 1px solid var(--line); border-radius: 12px 12px 0 0; transform: translateY(calc(100% - var(--sheet-peek))); transition: transform .2s ease; z-index: 10; }
      #side.open { transform: none; box-shadow: 0 -8px 24px #0008; }
      #side:not(.open) { overflow: hidden; }
      .sheet-handle { display: flex; width: 100%; height: var(--sheet-peek); box-sizing: border-box; align-items: center; justify-content: space-between; gap: 8px; border: 0; border-radius: 0; background: transparent; padding: 0; position: sticky; top: 0; background: var(--panel-solid); z-index: 1; }
      .sheet-handle::before { content: ''; position: absolute; left: 50%; top: 6px; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--line); }
      .sheet-handle .big { font-size: 18px; }
      #side h1, #side > .row.headline { display: none; }
      #log { display: none; }
      #hud { font-size: 11px; }
      #camBar { width: 110px; }
      #camTitle { max-width: calc(100% - 150px); }
    }
  </style>
</head>
<body>
  <div id="app">
    <main id="stage">
      <div id="scene"><div id="hud">connecting…</div></div>
      <section id="camera" hidden aria-label="raw video stand-in">
        <video id="cam" autoplay muted playsinline></video>
        <div id="camPlaceholder" hidden><b>camera unavailable</b><span id="camReason"></span><span class="baseline">stand-in for the drone's raw video feed</span></div>
        <div id="camTitle">raw video (laptop camera stand-in)</div>
        <div id="camBar">
          <select id="res" aria-label="video quality">
            <option value="360">360p</option>
            <option value="480">480p</option>
            <option value="720" selected>720p</option>
            <option value="1080">1080p</option>
          </select>
        </div>
        <div id="camOverlay">
          <div>raw video at this quality: <span class="big" id="rawRate">1.50 Mbps</span></div>
          <div class="baseline" id="rawVs"></div>
        </div>
      </section>
    </main>
    <aside id="side">
      <button id="sheetToggle" class="sheet-handle" aria-expanded="false"><span>link in</span><span class="big" id="sheetBps">0 bps</span><span class="baseline" id="sheetErr">controls ▴</span></button>
      <h1>MinBand twin</h1>
      <div class="row headline"><span>link in</span><span class="big" id="bps">0 bps</span></div>
      <canvas id="graph"></canvas>
      <div class="baseline" id="baselines"></div>
      <div class="readout">
        <div class="row"><span>twin error</span><span class="big" id="twinErr">–</span></div>
        <div class="baseline" id="twinErrDetail">no ground truth uploaded</div>
      </div>
      <label for="scenario">scenario</label>
      <select id="scenario">
        <option value="clean">clean</option>
        <option value="contested">contested (50 kbps, 300 ms, 5%)</option>
        <option value="jammed">jammed (2 kbps, 800 ms, 30%)</option>
        <option value="blackout">blackout 10 s</option>
        <option value="custom" disabled>custom</option>
      </select>
      <label>bandwidth cap <span id="bpsv">off</span></label>
      <input id="capSlider" type="range" min="0" max="200" value="0" />
      <label>latency <span id="delayv">0 ms</span></label>
      <input id="delaySlider" type="range" min="0" max="2000" step="50" value="0" />
      <label>packet loss <span id="lossv">0%</span></label>
      <input id="lossSlider" type="range" min="0" max="100" value="0" />
      <label>edge byte budget <span id="budgetv">unlimited</span></label>
      <input id="budgetSlider" type="range" min="0" max="200" value="0" />
      <div class="buttons">
        <button id="impair">impairment: off</button>
        <button id="fusion" class="on">fusion: on</button>
        <button id="ghosts">ghosts</button>
        <button id="sbs">side-by-side</button>
      </div>
      <div id="devices" style="margin-top:12px"></div>
    </aside>
    <pre id="log"></pre>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
